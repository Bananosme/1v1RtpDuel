# ============================================================
#  1v1RtpDuel — configuration
# ============================================================

# Default values for worlds
default-border: 10000
default-spawn-distance: 8

# Duel worlds: one of them is picked at random when a match starts.
# border — range of random spawn coordinates (± blocks along X and Z)
# spawn-distance — distance between the two players on spawn
worlds:
  world_1v1:
    border: 10000
    spawn-distance: 8
  world_1v1_2:
    border: 5000
    spawn-distance: 12

# Spawn world: players who die on an arena respawn here
spawn-world: "world"

# Queue boss bar (color/style: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE / SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20)
bossbar-color: GREEN
bossbar-style: SOLID

# ============================================================
#  /rtp — random teleport with a world-selection GUI
#  size — GUI size (multiple of 9, from 9 to 54)
#  worlds — GUI worlds: slot (optional, assigned automatically),
#  material, name and lore are customizable.
#  If worlds is empty, every world from the worlds section is used.
# ============================================================
rtp:
  gui:
    title: "<green>Select a world for RTP"
    size: 27
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    worlds:
      world:
        slot: 11
        material: GRASS_BLOCK
        name: "<green>Overworld"
        lore:
          - "<gray>Click to teleport"
      world_1v1:
        slot: 13
        material: NETHERITE_SWORD
        name: "<red>1v1 Arena"
        lore:
          - "<gray>Click to teleport"
          - "<red>Dangerous!"

# ============================================================
#  Messages. Formatting: MiniMessage (<green>, <bold>, <#ff0000>)
#  or legacy codes (&a&l, &#RRGGBB). A literal & is written as &&.
#  Placeholders: {position}, {opponent}, {worlds}, {permission}, {world}, {x}, {y}, {z}
# ============================================================
messages:
  console-only: "<red>This command can only be used by players."
  no-permission: "<red>You don't have permission {permission}."
  in-queue: "<green>You joined the 1v1 queue! Your position: <yellow>{position}"
  already-in-queue: "<red>You are already in the 1v1 queue."
  left-queue: "<yellow>You left the 1v1 queue."
  not-in-queue: "<yellow>You are not in the 1v1 queue."
  no-worlds: "<red>None of the 1v1 worlds are loaded: <yellow>{worlds}<red>."
  found: "<green><bold>Opponent found: <yellow>{opponent}<green>!"
  arena-not-found: "<red>Could not find a spot for the arena. Please try again."
  title-go: "<green><bold>GO!"
  bossbar-queue: "<yellow>You are in the 1v1 queue. Position: {position}"
  rtp-no-worlds: "<red>No worlds available for RTP."
  rtp-world-unavailable: "<red>World <yellow>{world} <red>is unavailable."
  rtp-not-found: "<red>Could not find a spot to teleport to. Please try again."
  rtp-teleported: "<green>Teleported to <yellow>{x}, {y}, {z}<green>."
